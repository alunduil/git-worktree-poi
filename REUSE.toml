# SPDX-License-Identifier: MIT

# Copyright and licensing for files that cannot carry inline SPDX headers.

version = 1
SPDX-PackageName = "git-worktree-poi"
SPDX-PackageSupplier = "Alex Brandt"
SPDX-PackageDownloadLocation = "https://github.com/alunduil/git-worktree-poi"

# - Markdown: a header would render on GitHub's landing page.
# - Cargo.lock: Cargo regenerates it wholesale and drops any header.
# - LICENSE: GitHub's license detector matches only root-level filenames, so
#   the text stays here as well as under LICENSES/.

[[annotations]]
path = ["**.md", "Cargo.lock", "LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt"
SPDX-License-Identifier = "MIT"
