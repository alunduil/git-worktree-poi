---
extends: default

rules:
  # Allows the `@<sha> # v1.2.3` action pin style.
  comments:
    min-spaces-from-content: 1

  # A SHA-pinned `uses:` line with its version comment runs past 80.
  line-length:
    max: 120

  # `on:` is a GitHub Actions trigger key, not a boolean.
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: false
