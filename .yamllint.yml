---
extends: default

rules:
  # Version comments after SHA pins take one space.
  comments:
    min-spaces-from-content: 1

  # `on:` is a GitHub Actions trigger key, not a boolean.
  truthy:
    allowed-values: ['true', 'false', 'on']
    check-keys: false
