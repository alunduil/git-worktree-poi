---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on main keeps a result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The clippy hook compiles every dependency.
      - &rust-cache
        name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up prek
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: prek

      - name: Cache hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure --color=always

  test:
    name: Run the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - *checkout
      - *rust-cache

      - name: Run tests
        run: cargo test --locked

  deny:
    name: Check dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - *checkout

      - name: Set up cargo-deny
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: cargo-deny

      - name: Check dependencies
        run: cargo deny --locked check

  build:
    name: Build the x86_64 Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TARGET: x86_64-unknown-linux-gnu

    steps:
      - *checkout
      - *rust-cache

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      # Catches a binary that builds but fails at startup.
      - name: Run the built binary
        run: ./target/"$TARGET"/release/git-worktree-poi --version
